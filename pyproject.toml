[project]
name = "financialreportagent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Owl-Yellow", email = "billyyellow@foxmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.32",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "files>=1.1.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langchain-qwq>=0.3.5",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
serve = "financialreportagent.app:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
